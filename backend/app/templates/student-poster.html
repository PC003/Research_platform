<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Recognition Poster</title>
  <style>
    :root {
      --vit-navy: #0F204B;
      --vit-gold: #F2A900;
      --bg-color: #F8FAFC;
    }
    body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1350px;
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--bg-color) 0%, #E2E8F0 100%);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .header {
      background-color: var(--vit-navy);
      color: white;
      padding: 50px 80px;
      text-align: center;
      position: relative;
      border-bottom: 8px solid var(--vit-gold);
    }
    .header h1 {
      margin: 0;
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .header h2 {
      margin: 15px 0 0 0;
      font-size: 32px;
      color: var(--vit-gold);
      font-weight: 500;
    }
    .badge {
      display: inline-block;
      margin-top: 25px;
      background: white;
      color: var(--vit-navy);
      padding: 8px 24px;
      border-radius: 999px;
      font-size: 24px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .content {
      flex: 1;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .achievement-title {
      font-size: 42px;
      font-weight: 800;
      color: var(--vit-navy);
      margin-bottom: 40px;
      text-align: center;
    }
    .students-grid {
      display: grid;
      /* Responsive grid depending on count could be dynamic, but let's stick to 3 or 4 columns for this size */
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
      width: 100%;
    }
    .student-card {
      background: white;
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      border: 1px solid #E2E8F0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .student-photo {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 6px solid var(--bg-color);
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    .student-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--vit-navy);
      margin: 0 0 5px 0;
    }
    .student-id {
      font-size: 18px;
      font-weight: 500;
      color: #64748B;
      margin: 0;
    }
    .footer {
      background: var(--vit-navy);
      padding: 40px 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }
    .footer-left {
      font-size: 20px;
      font-weight: 600;
    }
    .footer-right {
      font-size: 18px;
      color: #CBD5E1;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>UG Research Excellence</h1>
    <h2>Celebrating Undergraduate Research Achievements</h2>
    <div class="badge">{{ month }} {{ year }}</div>
  </div>

  <div class="content">
    <div class="achievement-title">{{ achievement_type_display }}</div>
    
    <div class="students-grid" style="grid-template-columns: repeat({{ '4' if students|length > 6 else '3' }}, 1fr);">
      {% for student in students %}
      <div class="student-card">
        <img class="student-photo" 
             src="{{ student.photo_url if student.photo_url else 'https://ui-avatars.com/api/?name=' + student.name | urlencode + '&size=256&background=0F204B&color=fff' }}" 
             alt="{{ student.name }}" />
        <h3 class="student-name">{{ student.name }}</h3>
        <p class="student-id">{{ student.registration_number }}</p>
      </div>
      {% endfor %}
    </div>
  </div>

  <div class="footer">
    <div class="footer-left">Vellore Institute of Technology</div>
    <div class="footer-right">Office of Academic Research</div>
  </div>
</body>
</html>
